<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob shape-1"></div>
        <div class="blob shape-2"></div>
    </div>
    
    <main class="container">
        <header>
            <h1>AI Prompt <span>Generator</span></h1>
            <p>Craft perfect AI prompts in seconds.</p>
        </header>

        <section class="generator-card">
            <form id="prompt-form">
                <div class="form-group">
                    <label for="topic">Topic</label>
                    <input type="text" id="topic" name="topic" placeholder="e.g., Cloud Computing" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tone">Tone</label>
                        <select id="tone" name="tone" required>
                            <option value="Technical" selected>Technical</option>
                            <option value="Professional">Professional</option>
                            <option value="Casual">Casual</option>
                            <option value="Humorous">Humorous</option>
                            <option value="Academic">Academic</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="purpose">Purpose</label>
                        <select id="purpose" name="purpose" required>
                            <option value="Explain" selected>Explain</option>
                            <option value="Summarize">Summarize</option>
                            <option value="Analyze">Analyze</option>
                            <option value="Brainstorm">Brainstorm</option>
                            <option value="Create">Create</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="format">Format</label>
                        <select id="format" name="format" required>
                            <option value="Bullet Points" selected>Bullet Points</option>
                            <option value="Paragraphs">Paragraphs</option>
                            <option value="Table">Table</option>
                            <option value="Code">Code</option>
                            <option value="Essay">Essay</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="generate-btn">
                    Generate Prompt
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                </button>
            </form>
        </section>

        <section class="output-section hidden" id="output-section">
            <div class="output-header">
                <h2>Your Prompt</h2>
                <button id="copy-btn" class="copy-btn" aria-label="Copy to clipboard">
                    <svg id="copy-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                    <span class="copy-text">Copy</span>
                </button>
            </div>
            <div class="output-content">
                <p id="generated-prompt"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
